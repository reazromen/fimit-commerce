# Overlay for the official Supabase Docker Compose stack.
# Run with: docker compose -f docker-compose.yml -f docker-compose.fimit.yml up -d --build
services:
  fimit-app:
    container_name: fimit-app
    build:
      context: ${FIMIT_APP_PATH:?Set FIMIT_APP_PATH in the Supabase .env}
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL:?Set SUPABASE_PUBLIC_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY:?Set ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${FIMIT_APP_URL:?Set FIMIT_APP_URL}
    restart: unless-stopped
    depends_on:
      api-gw:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${FIMIT_APP_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_INTERNAL_URL: http://api-gw:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    security_opt:
      - no-new-privileges:true

  # Do not expose the Supabase API gateway or database pooler directly.
  # Caddy is the only public ingress and shares this Compose network.
  api-gw:
    ports: !reset []

  supavisor:
    ports: !reset []

  caddy:
    image: caddy:2.10-alpine
    container_name: fimit-caddy
    restart: unless-stopped
    depends_on:
      fimit-app:
        condition: service_healthy
      api-gw:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      FIMIT_APP_HOST: ${FIMIT_APP_HOST:?Set FIMIT_APP_HOST}
      SUPABASE_API_HOST: ${SUPABASE_API_HOST:?Set SUPABASE_API_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ${FIMIT_APP_PATH}/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
